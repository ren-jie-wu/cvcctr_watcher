name: CVCCTR Watcher

on:
  workflow_dispatch:
    inputs:

  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: cvcctr-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-python-${{ hashFiles('requirements.txt') }}-playwright

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run watcher once
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LOG_LEVEL: INFO
        run: |
          ARGS="--once --state-path cvcctr_state.json"

          python cvcctr_watcher.py $ARGS

      - name: Commit updated watcher state
        if: success()
        run: |
          if [[ -n "$(git status --porcelain cvcctr_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cvcctr_state.json
            git commit -m "Update watcher state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No state changes to commit."
          fi
